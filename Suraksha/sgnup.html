<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="sgnup.css"
    <title>Sign up</title>
</head>
<body>
    <div class="container">
            <h1>Welcome!</h1>
            <p class="subtitle">Create an account to begin</p>
            <p class="create">Create new account:</p>
            <form id="ContactForm" onsubmit="submitForm(event)">
            
            <div class="field">
            <label for="name">Full Name:</label>
            <input type="name" id="name" name="name" placeholder="Enter your name" required>
            </div>

            <div class="field">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter your email" required>
            </div>

            <div class="field">
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Create a password" required>
            </div>

            <div class="field">
            <label for="password">Confirm Password:</label>
            <input type="password" id="password" name="password" placeholder="Re-entre your password" required>
            </div>

            <label class="terms">
            <input type="checkbox" name="terms" />
            <span>I agree to the <a href="TermCon.html">Terms &amp; Conditions</a></span>
            </label>

            <button type="submit" class="signup-btn">Sign Up</button>
            </form>

            <p class="switch">Already have an account? <a href="lgin.html">Log In</a></p>

            <script src="scr.js"></script>
</body>
</html>
